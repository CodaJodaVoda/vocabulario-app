<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>try{if(window.AndroidApp)document.documentElement.dataset.theme=AndroidApp.theme();}catch(e){}</script>
<script>
/* Auto-Update: liegt eine neuere, online geladene Version im Speicher, wird sie statt dieser angezeigt.
   Das App-Skript (#appCode) wird dann gar nicht erst gestartet, siehe Lader am Ende. */
var BUILD = 3, NEXT_HTML = null;
try {
  var u = JSON.parse(localStorage.getItem('vocabulario.update') || 'null');
  if (u && u.build > BUILD && typeof u.html === 'string') { NEXT_HTML = u.html; document.documentElement.style.visibility = 'hidden'; }
} catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulario</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#e7eff0;
  --ink:#0f1f22;
  --ink-2:rgba(15,31,34,.62);
  --ink-3:rgba(15,31,34,.38);
  --glass:rgba(255,255,255,.46);
  --glass-fallback:rgba(250,253,253,.92);
  --stroke:rgba(255,255,255,.75);
  --hi:rgba(255,255,255,.95);
  --hair:rgba(15,31,34,.09);
  --fill:rgba(15,31,34,.05);
  --fill-hover:rgba(15,31,34,.085);
  --thumb:rgba(255,255,255,.95);
  --shadow:rgba(18,64,70,.2);
  --agua:#139aa3; --agua-ink:#0c7a82; --agua-soft:rgba(19,154,163,.14);
  --ok:#25b562; --ok-ink:#16874a; --ok-bg:rgba(37,181,98,.14); --ok-line:rgba(37,181,98,.55);
  --learn:#f0a01e;
  --pr:#7b5cff; --pr-2:#c4b3ff; --pr-ink:#5a3fd9; --pr-bg:rgba(123,92,255,.14);
  --bad:#e8493c; --bad-ink:#c3372b; --bad-bg:rgba(232,73,60,.12); --bad-line:rgba(232,73,60,.5);
  --blob1:rgba(19,154,163,.55); --blob2:rgba(240,154,42,.42); --blob3:rgba(91,157,255,.36);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061417; --ink:#eef6f7; --ink-2:rgba(238,246,247,.62); --ink-3:rgba(238,246,247,.36);
    --glass:rgba(255,255,255,.07); --glass-fallback:rgba(18,36,40,.94); --stroke:rgba(255,255,255,.14); --hi:rgba(255,255,255,.2);
    --hair:rgba(255,255,255,.09); --fill:rgba(255,255,255,.06); --fill-hover:rgba(255,255,255,.1);
    --thumb:rgba(255,255,255,.16); --shadow:rgba(0,0,0,.5);
    --agua-ink:#56d3db; --agua-soft:rgba(19,154,163,.24);
    --ok-ink:#55d98d; --ok-bg:rgba(37,181,98,.18); --bad-ink:#ff7a6e; --bad-bg:rgba(232,73,60,.18);
    --pr:#8f75ff; --pr-2:#d6caff; --pr-ink:#b7a6ff; --pr-bg:rgba(143,117,255,.22);
    --blob1:rgba(19,154,163,.42); --blob2:rgba(240,154,42,.24); --blob3:rgba(70,120,255,.26);
  }
}
:root[data-theme="dark"]{
  --bg:#061417; --ink:#eef6f7; --ink-2:rgba(238,246,247,.62); --ink-3:rgba(238,246,247,.36);
  --glass:rgba(255,255,255,.07); --glass-fallback:rgba(18,36,40,.94); --stroke:rgba(255,255,255,.14); --hi:rgba(255,255,255,.2);
  --hair:rgba(255,255,255,.09); --fill:rgba(255,255,255,.06); --fill-hover:rgba(255,255,255,.1);
  --thumb:rgba(255,255,255,.16); --shadow:rgba(0,0,0,.5);
  --agua-ink:#56d3db; --agua-soft:rgba(19,154,163,.24);
  --ok-ink:#55d98d; --ok-bg:rgba(37,181,98,.18); --bad-ink:#ff7a6e; --bad-bg:rgba(232,73,60,.18);
  --pr:#8f75ff; --pr-2:#d6caff; --pr-ink:#b7a6ff; --pr-bg:rgba(143,117,255,.22);
  --blob1:rgba(19,154,163,.42); --blob2:rgba(240,154,42,.24); --blob3:rgba(70,120,255,.26);
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* Hintergrund: drei weiche Farbfelder, nur transform wird animiert */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg);pointer-events:none}
.bg i{position:absolute;display:block;border-radius:50%;will-change:transform}
.bg.paused i{animation-play-state:paused}
.b1{width:72vmax;height:72vmax;top:-28vmax;left:-24vmax;background:radial-gradient(closest-side,var(--blob1),transparent);animation:d1 40s ease-in-out infinite alternate}
.b2{width:70vmax;height:70vmax;bottom:-32vmax;right:-24vmax;background:radial-gradient(closest-side,var(--blob2),transparent);animation:d2 48s ease-in-out infinite alternate}
.b3{width:48vmax;height:48vmax;top:34%;left:38%;background:radial-gradient(closest-side,var(--blob3),transparent);animation:d3 56s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(14vmax,9vmax,0)}}
@keyframes d2{to{transform:translate3d(-12vmax,-10vmax,0)}}
@keyframes d3{to{transform:translate3d(-16vmax,6vmax,0)}}

.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:54px;margin-bottom:8px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.025em}

/* Glas – immer nur eine Fläche pro Ansicht */
.glass{position:relative;background:var(--glass);
  -webkit-backdrop-filter:saturate(175%);backdrop-filter:saturate(175%);
  border:1px solid var(--stroke);border-radius:30px;
  box-shadow:inset 0 1px 0 var(--hi),0 22px 50px -24px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 72%,rgba(255,255,255,.09) 100%)}
.glass>*{position:relative}
@supports not ((backdrop-filter:saturate(1)) or (-webkit-backdrop-filter:saturate(1))){.glass{background:var(--glass-fallback)}}
.panel{padding:20px}

/* Bedienelemente */
.primary{appearance:none;border:0;font-weight:600;font-size:15px;color:#fff;padding:13px 24px;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,#22b3bc,#10939c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -8px rgba(16,147,156,.7);
  transition:transform .12s ease,filter .15s ease,opacity .15s ease}
.primary:hover{filter:brightness(1.06)}
.primary:active{transform:scale(.97)}
.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.primary.small{padding:10px 19px;font-size:14px}
.quiet{appearance:none;border:0;font-size:15px;font-weight:500;background:var(--fill);padding:12px 18px;border-radius:999px;cursor:pointer;transition:background .15s,transform .12s}
.quiet:hover{background:var(--fill-hover)}
.quiet:active{transform:scale(.97)}
.link{appearance:none;border:0;background:none;font-size:14px;color:var(--agua-ink);cursor:pointer;padding:4px 2px;border-radius:6px}
.link:disabled{opacity:.4;cursor:default}
.link.danger{color:var(--bad-ink)}
:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
.hidden{display:none!important}

.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--fill);--n:2}
.seg-3{--n:3}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:999px;background:var(--thumb);
  box-shadow:inset 0 1px 0 var(--hi),0 3px 10px -4px var(--shadow);transform:translateX(calc(var(--i,0) * 100%));transition:transform .34s cubic-bezier(.3,.9,.3,1)}
.seg button{position:relative;appearance:none;border:0;background:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:9px 6px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{color:var(--ink);font-weight:600}

.block{margin-top:24px}
.block h2{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:10px}
.block-head{display:flex;align-items:baseline;justify-content:space-between}
.links{display:flex;gap:12px}

.units{border-radius:20px;background:var(--fill);overflow:hidden}
.unit+.unit{border-top:1px solid var(--hair)}
.unit-row{display:flex;align-items:center;gap:12px;padding-left:14px;padding-right:12px}
.unit-name{flex:1;display:flex;align-items:center;gap:12px;min-height:52px;appearance:none;border:0;background:none;cursor:pointer;text-align:left;padding:0}
.nm{font-weight:600;font-size:15px}
.mast{position:relative;flex:1;max-width:84px;height:4px;margin-left:auto;border-radius:9px;background:var(--hair);overflow:hidden}
.mast i{position:absolute;inset:0;background:var(--ok);transform-origin:left;transform:scaleX(0);transition:transform .4s ease}
.mast i.f-pr{background:linear-gradient(90deg,var(--pr),var(--pr-2) 50%,var(--pr))}
.mast i.f-learn{background:var(--learn)}
.star{flex:none;font-size:12px;font-weight:600;color:var(--pr-ink);background:var(--pr-bg);padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.panel:not(.is-learn) .mast{visibility:hidden}
.n{font-size:13px;color:var(--ink-3);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.chev{flex:none;width:14px;height:14px;color:var(--ink-3);transition:transform .25s ease}
.unit-name[aria-expanded="true"] .chev{transform:rotate(180deg)}
.secs{padding:0 12px 10px 46px}
.sec{display:flex;align-items:center;gap:12px;min-height:40px;font-size:14px;cursor:pointer}
.sec .lbl{flex:1}
.upto{display:flex;align-items:center;gap:12px;min-height:46px;font-size:14px;color:var(--ink-2)}
.upto input[type=range]{flex:1;min-width:0;accent-color:var(--agua);cursor:pointer}
.upto input[type=number]{width:66px;font:inherit;font-size:15px;font-variant-numeric:tabular-nums;text-align:center;color:var(--ink);padding:7px 6px;border-radius:12px;border:1px solid var(--hair);background:var(--fill);outline:none;-moz-appearance:textfield}
.upto input[type=number]:focus{border-color:var(--agua);box-shadow:0 0 0 3px var(--agua-soft)}
.upto input[type=number]::-webkit-inner-spin-button,.upto input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

.ck{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:0;border-radius:7px;border:1.5px solid var(--ink-3);
  background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.ck:checked,.ck:indeterminate{background:var(--agua);border-color:var(--agua)}
.ck:checked::after{content:"";width:10px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.ck:indeterminate::after{content:"";width:9px;height:2px;border-radius:2px;background:#fff}

.toggles{display:flex;gap:8px;flex-wrap:wrap}
.toggle{appearance:none;border:1px solid var(--hair);background:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:9px 15px;border-radius:999px;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s,transform .12s}
.toggle:active{transform:scale(.97)}
.toggle[aria-pressed="true"]{background:var(--agua-soft);border-color:transparent;color:var(--agua-ink)}

.startbar{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sum{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:14px;color:var(--ink-2)}
.sum .link{padding:0;font-size:13px}

/* Session */
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin:2px 4px 8px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:6px;border-radius:9px;background:var(--hair);overflow:hidden;margin:0 2px 16px}
.bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.f-learn{background:var(--learn)} .f-ok{background:var(--ok)} .f-agua{background:var(--agua)}
/* Prestige: Perlmutt-Verlauf mit langsam wanderndem Glanz (nur transform) */
.f-pr{background:linear-gradient(90deg,var(--pr),var(--pr-2) 50%,var(--pr));overflow:hidden}
.f-pr::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);
  transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(260%)}}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(6,20,23,.42)}
.modal-box{width:100%;max-width:400px;background:var(--glass-fallback);color:var(--ink);border:1px solid var(--stroke);border-radius:26px;padding:22px 20px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.modal-box h2{font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
.modal-box p{color:var(--ink-2);margin-top:8px}
.modal-box .actions{margin-top:20px}
.primary.danger{background:linear-gradient(180deg,#ef5d51,#d63a2d);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px rgba(214,58,45,.7)}
.bar.big{height:10px;margin:18px 0 10px}

.card{padding:34px 22px 26px;min-height:330px;display:flex}
.inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lang{font-size:13px;font-weight:500;color:var(--ink-2)}
.term{font-size:clamp(28px,7vw,42px);font-weight:600;letter-spacing:-.022em;line-height:1.15;margin:8px 0 28px;max-width:18ch;overflow-wrap:anywhere}

.mc{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:12px 14px;border-radius:18px;background:var(--fill);
  border:1px solid transparent;font-size:15px;line-height:1.3;cursor:pointer;transition:background .15s,opacity .2s,transform .12s,border-color .15s}
.opt:hover{background:var(--fill-hover)}
.opt:active{transform:scale(.98)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--fill)}
.opt.is-ok{background:var(--ok-bg);border-color:var(--ok-line)}
.opt.is-bad{background:var(--bad-bg);border-color:var(--bad-line)}
.opt.is-dim{opacity:.4}

.write{width:100%;display:flex;flex-direction:column;gap:12px}
.write input{width:100%;font:inherit;font-size:18px;padding:15px 16px;border-radius:16px;border:1px solid var(--hair);background:var(--fill);color:var(--ink);
  outline:none;transition:border-color .15s,box-shadow .15s}
.write input:focus{border-color:var(--agua);box-shadow:0 0 0 4px var(--agua-soft)}
.write input.is-ok{border-color:var(--ok-line);box-shadow:none}
.write input.is-bad{border-color:var(--bad-line);box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.write.answered .row{display:none}
.par{font-size:.58em;font-weight:500;color:var(--ink-2);letter-spacing:0}

.fb{width:100%;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);text-align:left;display:flex;flex-direction:column;gap:3px}
.fb-title{font-weight:600}
.fb.ok .fb-title{color:var(--ok-ink)}
.fb.bad .fb-title{color:var(--bad-ink)}
.fb-line{font-size:15px}
.fb-you{font-size:14px;color:var(--ink-2)}
.fb .row{margin-top:12px;justify-content:flex-end}

.keyhint{text-align:center;font-size:13px;color:var(--ink-3);margin-top:14px;min-height:18px}
@media (hover:none){.keyhint{display:none}}

.flash{cursor:pointer;touch-action:manipulation}
.flash.dragging{will-change:transform}
.flash .term{margin-bottom:18px}
.reveal{width:100%;padding-top:18px;border-top:1px solid var(--hair)}
.term.answer{font-size:clamp(24px,6vw,34px);margin:8px auto}
.src{font-size:12px;color:var(--ink-3);margin-top:18px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions>*{flex:1 1 140px}
.choice{appearance:none;border:0;font-weight:600;font-size:15px;padding:14px;border-radius:999px;cursor:pointer;transition:transform .12s,filter .15s}
.choice:active{transform:scale(.97)}
.choice.bad{background:var(--bad-bg);color:var(--bad-ink)}
.choice.good{background:var(--ok-bg);color:var(--ok-ink)}

/* Wischen bei Karteikarten */
.swipe .flash.flip{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.card .tint{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;display:flex;align-items:flex-start;padding:16px 20px;font-size:14px;font-weight:600}
.tint.good{justify-content:flex-start;color:var(--ok-ink);box-shadow:inset 0 0 0 2px var(--ok-line);background:var(--ok-bg)}
.tint.bad{justify-content:flex-end;color:var(--bad-ink);box-shadow:inset 0 0 0 2px var(--bad-line);background:var(--bad-bg)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;transform:translateX(-50%);
  padding:10px 18px;border-radius:999px;background:var(--glass-fallback);color:var(--ink);font-size:14px;font-weight:500;
  border:1px solid var(--stroke);box-shadow:0 10px 30px -12px var(--shadow);pointer-events:none;transition:opacity .3s ease}
/* Statistik */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px}
.tile{background:var(--fill);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tv{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{font-size:13px;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:128px}
.day{appearance:none;border:0;background:none;padding:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;border-radius:8px}
.day .col{flex:1;width:100%;max-width:22px;display:flex;align-items:flex-end;border-bottom:1px solid var(--hair)}
.day .col i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--agua);opacity:.55;transform-origin:bottom;transform:scaleY(0);transition:transform .7s cubic-bezier(.3,.9,.3,1),opacity .15s}
.day.today .col i,.day[aria-pressed="true"] .col i{opacity:1}
.day .d{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.day.today .d{color:var(--ink);font-weight:600}
.daycap{font-size:13px;color:var(--ink-2);margin-top:10px;min-height:19px;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:baseline;font-size:14px;padding:6px 0}
.mrow .pv{color:var(--ink-2);font-variant-numeric:tabular-nums}
.mt{position:relative;grid-column:1/-1;height:6px;border-radius:9px;background:var(--hair);overflow:hidden}
.mt i{position:absolute;inset:0;border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform .7s cubic-bezier(.3,.9,.3,1)}
.urow{padding:8px 0 4px;border-top:1px solid var(--hair)}
.urow:first-child{border-top:0}
.urow .nm{display:block;margin-bottom:2px}
.urow .mrow{font-size:13px;padding:3px 0;color:var(--ink-2)}
.results .n{color:var(--bad-ink);font-weight:600;font-variant-numeric:tabular-nums}
#stWrong li{grid-template-columns:34px 1fr 1fr}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tv{font-size:22px}}
.sum-title{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sum-text{color:var(--ink-2);margin-top:6px}
.legend{font-size:14px;color:var(--ink-2)}
.results{list-style:none;padding:0;margin:18px 0 0;max-height:340px;overflow:auto;border-top:1px solid var(--hair)}
.results li{display:grid;grid-template-columns:18px 1fr 1fr;gap:10px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--hair);font-size:14.5px}
.results .a{font-weight:600}
.results .b{color:var(--ink-2)}
.mk::before{content:"✓";color:var(--ok-ink);font-weight:700}
.results .bad .mk::before{content:"✕";color:var(--bad-ink)}
#sActions{margin-top:22px}

@media (max-width:520px){
  .mc{grid-template-columns:1fr}
  .card{padding:28px 16px 20px;min-height:300px}
  .panel{padding:16px}

<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div class="app">
  <header class="top">
    <h1 class="brand">Vocabulario</h1>
    <button class="quiet hidden" id="exit" type="button">Beenden</button>
  </header>

  <!-- Auswahl -->
  <main id="vSetup" class="view glass panel is-learn">
    <div class="seg seg-3" role="radiogroup" aria-label="Modus" id="segMode">
      <span class="thumb"></span>
      <button type="button" role="radio" data-v="learn">Lernen</button>
      <button type="button" role="radio" data-v="cards">Karteikarten</button>
      <button type="button" role="radio" data-v="stats">Statistik</button>
    </div>

    <div id="setupBody">
    <div class="block">
      <div class="block-head">
        <h2>Abschnitte</h2>
        <div class="links"><button type="button" class="link" id="selAll">Alle</button><button type="button" class="link" id="selNone">Keine</button></div>
      </div>
      <div class="units" id="units"></div>
    </div>

    <div class="block">
      <h2>Richtung</h2>
      <div class="seg seg-3" role="radiogroup" aria-label="Richtung" id="segDir">
        <span class="thumb"></span>
        <button type="button" role="radio" data-v="es-de">ES → DE</button>
        <button type="button" role="radio" data-v="de-es">DE → ES</button>
        <button type="button" role="radio" data-v="mix">Gemischt</button>
      </div>
    </div>

    <div class="block" id="typesBlock">
      <h2>Fragen</h2>
      <div class="toggles">
        <button type="button" class="toggle" data-t="mc">Multiple Choice</button>
        <button type="button" class="toggle" data-t="write">Schreiben</button>
      </div>
    </div>

    <div class="block hidden" id="swipeBlock">
      <h2>Bedienung</h2>
      <div class="toggles">
        <button type="button" class="toggle" id="swipeToggle">Wischen: links nochmal, rechts gewusst</button>
      </div>
    </div>

    <div class="startbar">
      <div class="sum"><span id="sumText"></span><button type="button" class="link danger hidden" id="reset">Fortschritt zurücksetzen</button></div>
      <button type="button" class="primary" id="start">Lernen starten</button>
    </div>
    </div>

    <div id="statsBody" class="hidden">
      <div class="block">
        <h2>Überblick, beide Richtungen</h2>
        <div class="bar big" aria-hidden="true"><i class="f-pr" id="stBarP"></i><i class="f-learn" id="stBarL"></i><i class="f-ok" id="stBarM"></i></div>
        <p class="legend" id="stLegend"></p>
      </div>
      <div class="tiles" id="stTiles"></div>
      <div class="block">
        <h2>Antworten der letzten 14 Tage</h2>
        <div class="days" id="stDays"></div>
        <p class="daycap" id="stDayCap" aria-live="polite"></p>
      </div>
      <div class="block">
        <h2>Trefferquote</h2>
        <div id="stAcc"></div>
      </div>
      <div class="block">
        <h2>Gemeistert pro Unidad</h2>
        <div id="stUnits"></div>
      </div>
      <div class="block">
        <h2>Am öftesten falsch</h2>
        <ul class="results" id="stWrong"></ul>
        <p class="legend hidden" id="stWrongNone">Noch keine Fehler gezählt.</p>
      </div>
      <div class="startbar">
        <span class="legend" id="stSince"></span>
        <button type="button" class="link danger" id="stReset">Statistik zurücksetzen</button>
      </div>
    </div>
  </main>

  <!-- Lernen -->
  <main id="vLearn" class="view hidden">
    <div class="meta"><span id="lRound">Runde 1</span><span id="lCount"></span></div>
    <div class="bar" aria-hidden="true"><i class="f-pr" id="lBarP"></i><i class="f-learn" id="lBarL"></i><i class="f-ok" id="lBarM"></i></div>
    <section class="glass card">
      <div class="inner" id="lInner" aria-live="polite">
        <p class="lang" id="lLang"></p>
        <p class="term" id="lTerm"></p>
        <div class="mc hidden" id="lMC"></div>
        <form class="write hidden" id="lWrite" autocomplete="off">
          <input id="lInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort eingeben" aria-label="Antwort">
          <div class="row">
            <button type="button" class="link" id="lDunno">Weiß ich nicht</button>
            <button type="submit" class="primary small" id="lCheck">Prüfen</button>
          </div>
        </form>
        <div class="fb hidden" id="lFb">
          <p class="fb-title" id="lFbTitle"></p>
          <p class="fb-line" id="lFbLine"></p>
          <p class="fb-you" id="lFbYou"></p>
          <div class="row">
            <button type="button" class="quiet hidden" id="lOverride">Doch richtig</button>
            <button type="button" class="primary small" id="lNext">Weiter</button>
          </div>
        </div>
      </div>
    </section>
    <p class="keyhint" id="lHint"></p>
  </main>

  <!-- Karteikarten -->
  <main id="vCards" class="view hidden">
    <div class="meta"><span id="cRound">Runde 1</span><span id="cCount"></span></div>
    <div class="bar" aria-hidden="true"><i class="f-agua" id="cBar"></i></div>
    <section class="glass card flash" id="cCard" tabindex="0" role="button" aria-label="Karte umdrehen">
      <div class="inner" id="cInner">
        <p class="lang" id="cLang"></p>
        <p class="term" id="cFront"></p>
        <div class="reveal hidden" id="cBackWrap">
          <p class="lang" id="cLang2"></p>
          <p class="term answer" id="cBack"></p>
        </div>
        <p class="src" id="cSrc"></p>
      </div>
      <span class="tint good" id="cTintOk" aria-hidden="true">Gewusst</span>
      <span class="tint bad" id="cTintBad" aria-hidden="true">Nochmal</span>
    </section>
    <div class="actions" id="cFrontActions"><button type="button" class="primary" id="cFlip">Umdrehen</button></div>
    <div class="actions hidden" id="cBackActions">
      <button type="button" class="choice bad" id="cAgain">Nochmal</button>
      <button type="button" class="choice good" id="cOk">Gewusst</button>
    </div>
    <p class="keyhint">Leertaste dreht um, ← nochmal, → gewusst</p>
  </main>

  <!-- Sicherheitsabfrage -->
  <div class="modal hidden" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle" aria-describedby="cfText">
    <div class="modal-box">
      <h2 id="cfTitle"></h2>
      <p id="cfText"></p>
      <div class="actions">
        <button type="button" class="quiet" id="cfCancel">Abbrechen</button>
        <button type="button" class="primary danger" id="cfOk" disabled>Löschen</button>
      </div>
    </div>
  </div>

  <!-- Zwischenstand / Ende -->
  <main id="vSum" class="view glass panel hidden">
    <h2 class="sum-title" id="sTitle"></h2>
    <p class="sum-text" id="sText"></p>
    <div class="bar big hidden" id="sBar" aria-hidden="true"><i class="f-pr" id="sBarP"></i><i class="f-learn" id="sBarL"></i><i class="f-ok" id="sBarM"></i></div>
    <p class="legend hidden" id="sLegend"></p>
    <ul class="results hidden" id="sList"></ul>
    <div class="actions" id="sActions"></div>
  </main>
</div>

/* ---------- Daten ---------- */
const TERMS = [];
const BYSEC = DATA.map(() => []);
DATA.forEach((s, si) => s.words.forEach(w => { const t = { id: w.es + '\u241f' + w.de, es: w.es, de: w.de, sec: si, n: w.n || 0 }; TERMS.push(t); BYSEC[si].push(t); }));
const GROUPS = [];
DATA.forEach((s, i) => { let g = GROUPS[GROUPS.length - 1]; if (!g || g.unit !== s.unit) { g = { unit: s.unit, secs: [] }; GROUPS.push(g); } g.secs.push(i); });
GROUPS.forEach(g => {

/* Lern-Einheit = Vokabel + Richtung; bei „Gemischt“ jede Vokabel in beide Richtungen */
const ITEMS = new Map();
function item(t, dir) {
  const id = t.id + '␟' + dir;
  let it = ITEMS.get(id);
  if (!it) { it = { id, tid: t.id, dir, es: t.es, de: t.de, sec: t.sec, n: t.n, q: dir === 'es-de' ? t.es : t.de, a: dir === 'es-de' ? t.de : t.es }; ITEMS.set(id, it); }
  return it;
}
const dirs = () => S.dir === 'mix' ? ['es-de', 'de-es'] : [S.dir];
function itemsOf(terms) { const ds = dirs(), out = []; terms.forEach(t => ds.forEach(d => out.push(item(t, d)))); return out; }
// mischen, ohne dass beide Richtungen desselben Worts direkt aufeinander folgen
function spread(a) {
  const rest = shuffle(a.slice()), out = [];
  while (rest.length) {
    const k = rest.findIndex(x => !out.length || x.tid !== out[out.length - 1].tid);
    if (k >= 0) { out.push(rest.splice(k, 1)[0]); continue; }
    const x = rest.pop(); // nur noch die Gegenrichtung des letzten Worts übrig: weiter vorne einfügen
    const pos = out.findIndex((y, i) => y.tid !== x.tid && (!i || out[i - 1].tid !== x.tid));
    out.splice(Math.max(0, pos), 0, x);
  }
  return out;
}

function secLabel(s) {
  if (s.title === s.unit) return 'Grundwortschatz';
  let l = s.title.indexOf(s.unit) === 0 ? s.title.slice(s.unit.length).trim() : s.title;
  l = l.replace(/^[–—-]\s*/, '');

}
function srcLabel(si, n) { const s = DATA[si]; if (n) return s.unit + ', Nr. ' + n; const l = secLabel(s); return l === 'Grundwortschatz' ? s.unit : s.unit + ', ' + l; }

    BYSEC[i].forEach(t => { if (lim && t.n && t.n > lim) return; if (!seen.has(t.id)) { seen.add(t.id); out.push(t); } }); });
  return out;
}

/* ---------- Antwortprüfung ---------- */
const ART_ES = /^(el\/la|la\/el|los\/las|un\/a|el|la|los|las|un|una|unos|unas)\s+/;
const ART_DE = /^(der\/die|die\/der|der|die|das|den|dem|des|ein\/e|ein|eine|einen)\s+/;

const fold = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ß/g, 'ss');
function variants(target) {
  const out = new Set();
  const add = s => { s = base(s); if (s) out.add(s); };
  const x = String(target).replace(/\bhier:\s*/gi, '');
  const noPar = x.replace(/\([^)]*\)/g, ' ');
  [x, noPar].forEach(v => { add(v); v.split(/[,;]|\s\/\s/).forEach(add); });
  Array.from(out).forEach(v => {
    add(v.replace(/\/-?[a-zäöüßáéíóúñ]+/g, ''));
    add(v.replace(/\s(de|a|con)$/, ''));
  });
  return Array.from(out);
}
function check(input, target, lang) {
  const u = base(input);
  if (!u) return { ok: false };
  const vs = variants(target), uf = fold(u);
  if (vs.some(v => fold(v) === uf)) return { ok: true, exact: vs.indexOf(u) !== -1 && base(target) === u };
  if (lang === 'de') {
    const s = v => fold(v.replace(ART_DE, ''));
    if (vs.some(v => s(v) === s(u))) return { ok: true, exact: false };
    return { ok: false };
  }
  const s = v => fold(v.replace(ART_ES, ''));
  if (vs.some(v => ART_ES.test(v) && s(v) === uf)) return { ok: false, reason: 'article' };
  if (ART_ES.test(u) && vs.some(v => ART_ES.test(v) && s(v) === s(u))) return { ok: false, reason: 'wrongArticle' };
  return { ok: false };
}

/* ---------- Einstellungen ---------- */

/* Sicherheitsabfrage: „Löschen“ erst nach 3 Sekunden drückbar */
const CF = { open: false, since: 0, onOk: null, label: '', timer: 0 };

$('reset').onclick = () => {

  const dirTxt = S.dir === 'mix' ? 'beide Richtungen' : S.dir === 'es-de' ? 'ES → DE' : 'DE → ES';
  confirmDanger('Fortschritt wirklich löschen?',
    'Gemeistert, am Lernen und Prestige von ' + items.length + (items.length === 1 ? ' Eintrag' : ' Einträgen') + ' (' + dirTxt + ') werden gelöscht. Das lässt sich nicht rückgängig machen.',
    'Löschen', () => { items.forEach(it => { delete P[it.id]; delete PR[it.id]; }); save(KP, P); save(KPR, PR); syncSetup(); });
};

// m = gemeistert, l = am Lernen, p = neu, aber mit Prestige, pr = Prestige gesamt, star = kleinste Prestige-Stufe
function counts(pool) {
  let m = 0, l = 0, p = 0, pr = 0, star = pool.length ? Infinity : 0;
  pool.forEach(t => {
    const v = lvl(t.id), s = prest(t.id);
    if (v === 2) m++; else if (v === 1) l++; else if (s) p++;
    if (s) pr++;
    if (s < star) star = s;
  });
  return { m, l, p, pr, star, n: pool.length - m - l, total: pool.length };
}
let syncQueued = false;
function flushSync() { if (!syncQueued) return; syncQueued = false; persist(); syncSetup(); }
function syncSoon() { if (syncQueued) return; syncQueued = true; raf(flushSync); }
function syncSetup() {

  segSet($('segMode'), S.mode); segSet($('segDir'), S.dir);
  $('setupBody').classList.toggle('hidden', stats);
  $('statsBody').classList.toggle('hidden', !stats);
  if (stats) { renderStats(); return; }
  $('vSetup').classList.toggle('is-learn', learn);
  $('typesBlock').classList.toggle('hidden', !learn);
  $('swipeBlock').classList.toggle('hidden', learn);
  $('swipeToggle').setAttribute('aria-pressed', S.swipe ? 'true' : 'false');
  $('vCards').classList.toggle('swipe', !!S.swipe);
  document.querySelectorAll('.toggle[data-t]').forEach(b => b.setAttribute('aria-pressed', S.types[b.dataset.t] ? 'true' : 'false'));
  GROUPS.forEach((g, gi) => {
    const row = unitsBox.children[gi];
    const lim = g.numbered ? (S.upto[g.unit] || 0) : 0;
    const full = i => selSet.has(i) && !(lim && DATA[i].words.some(w => w.n > lim));
    const on = g.secs.filter(i => selSet.has(i)).length, fullN = g.secs.filter(full).length;
    const gck = row.querySelector('[data-g]');
    gck.checked = fullN === g.secs.length; gck.indeterminate = on > 0 && fullN < g.secs.length;
    row.querySelectorAll('[data-s]').forEach(c => { const i = +c.dataset.s; c.checked = full(i); c.indeterminate = selSet.has(i) && !full(i); });
    if (g.numbered) {
      const sel = g.secs.filter(i => selSet.has(i));
      let upto = lim || (sel.length ? Math.max.apply(null, sel.map(i => Math.max.apply(null, DATA[i].words.map(w => w.n)))) : 1);
      const r = row.querySelector('[data-upto-range]'), nf = row.querySelector('[data-upto-num]');
      r.value = upto; if (document.activeElement !== nf) nf.value = upto;
    }
    if (!g.terms) g.terms = uniqueTerms(g.secs, true);
    row.querySelector('.unit-row .n').textContent = g.terms.length;
    const c = counts(itemsOf(g.terms)), T = c.total || 1, mi = row.querySelectorAll('.mast i');
    mi[0].style.transform = 'scaleX(' + (c.m + c.l + c.p) / T + ')';
    mi[1].style.transform = 'scaleX(' + (c.m + c.l) / T + ')';
    mi[2].style.transform = 'scaleX(' + c.m / T + ')';
    const st = row.querySelector('.star');

    st.textContent = '★ ' + c.star; st.title = 'Prestige-Stufe ' + c.star;
  });

  const c = counts(itemsOf(pool)), mix = S.dir === 'mix';
  $('sumText').textContent = pool.length + (pool.length === 1 ? ' Wort' : ' Wörter') +
    (mix && pool.length ? ' · ' + c.total + (learn ? ' Fragen' : ' Karten') : '') + (learn ? ', ' + c.m + ' gemeistert' : '');
  $('reset').classList.toggle('hidden', !learn || (c.m + c.l + c.pr) === 0);
  $('start').textContent = learn ? 'Lernen starten' : 'Karteikarten starten';
  $('start').disabled = pool.length === 0;
}
$('start').onclick = () => {
  const pool = uniqueTerms(Array.from(selSet));
  if (!pool.length) return;
  if (S.mode === 'learn') startLearn(pool); else startCards(pool);

/* ---------- Lernen (Quizlet-Prinzip) ---------- */
const ROUND = 7;
const L = { terms: [], pool: [], round: 0, queue: [], cur: null, phase: 'idle', seen: new Set(), results: [], timer: 0 };
function startLearn(terms) { L.terms = terms; L.pool = itemsOf(terms); L.round = 0; L.seen = new Set(); show('learn'); nextRound(); }
function learnMeta() {
  const c = counts(L.pool);
  $('lRound').textContent = 'Runde ' + Math.max(1, L.round);
  $('lCount').textContent = c.m + ' von ' + c.total + ' gemeistert';
  setBar($('lBarL'), $('lBarM'), c);
}
function nextRound() {
  const open = L.pool.filter(t => lvl(t.id) < 2);
  if (!open.length) return learnDone();
  const a = shuffle(open.filter(t => lvl(t.id) === 1));
  const b = shuffle(open.filter(t => lvl(t.id) === 0 && L.seen.has(t.id)));
  const c = shuffle(open.filter(t => lvl(t.id) === 0 && !L.seen.has(t.id)));
  const pick = [], used = new Set(); // pro Runde jedes Wort nur in einer Richtung
  a.concat(b, c).forEach(t => { if (pick.length < ROUND && !used.has(t.tid)) { used.add(t.tid); pick.push(t); } });
  L.queue = shuffle(pick);
  L.round++; L.results = [];
  if (VIEW !== 'learn') show('learn');
  ask();
}
function qType(t) {
  if (S.types.mc && S.types.write) return lvl(t.id) === 0 ? 'mc' : 'write';
  return S.types.mc ? 'mc' : 'write';
}
function ask() {
  clearTimeout(L.timer);
  if (!L.queue.length) return checkpoint();
  const t = L.queue.shift();
  const dir = t.dir;
  const q = { t, dir, type: qType(t), ansLang: dir === 'es-de' ? 'de' : 'es', answer: t.a, prompt: t.q };
  L.cur = q; L.phase = 'ask';
  $('lLang').textContent = (dir === 'es-de' ? 'Spanisch' : 'Deutsch') + (t.n ? ', Nr. ' + t.n : '');
  $('lTerm').innerHTML = termHTML(q.prompt);
  $('lFb').classList.add('hidden');
  $('lMC').classList.toggle('hidden', q.type !== 'mc');
  $('lWrite').classList.toggle('hidden', q.type !== 'write');
  if (q.type === 'mc') renderMC(q);
  else {
    const i = $('lInput');
    i.value = ''; i.readOnly = false; i.classList.remove('is-ok', 'is-bad'); $('lWrite').classList.remove('answered');
    $('lDunno').disabled = false; $('lCheck').disabled = false;
    setTimeout(() => { try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } }, 0);
  }
  $('lHint').textContent = q.type === 'mc' ? 'Tasten 1 bis 4 wählen eine Antwort' : 'Enter prüft die Antwort';
  learnMeta();
  enter($('lInner'));
}
function renderMC(q) {
  const k = q.ansLang, norm = s => fold(base(s));
  const used = new Set([norm(q.answer)]), opts = [];
  function take(arr) {
    const copy = shuffle(arr.slice());
    for (let i = 0; i < copy.length && opts.length < 3; i++) {
      const v = copy[i][k], nv = norm(v);
      if (!used.has(nv)) { used.add(nv); opts.push(v); }
    }

  if (VIEW === 'learn') {
    if (L.phase === 'ask' && L.cur && L.cur.type === 'mc' && /^[1-4]$/.test(e.key)) { e.preventDefault(); pickMC(+e.key - 1); return; }

/* ---------- Statistik ---------- */
// Tageswerte: la/lr = Lernen Antworten/richtig, ca/cr = Karteikarten, t = aktive Lernzeit in ms.
// Lernzeit zählt nur in Lernen/Karteikarten/Zwischenstand, Lücken über 30 s zwischen zwei Eingaben gar nicht.
const KST = 'vocabulario.stats.v1', IDLE = 30000;
let ST = load(KST, null);
if (!ST || typeof ST !== 'object' || !ST.days) ST = { days: {}, wrong: {} };
if (!ST.wrong) ST.wrong = {};
const ACT = { last: 0 };
const pad2 = n => (n < 10 ? '0' : '') + n;
const dayKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const EMPTY_DAY = () => ({ la: 0, lr: 0, ca: 0, cr: 0, t: 0 });
function today() { const k = dayKey(new Date(Date.now())); return ST.days[k] || (ST.days[k] = EMPTY_DAY()); }
function saveStats() { save(KST, ST); }
function record(mode, ok, tid) {
  const d = today(); d[mode + 'a']++;
  if (ok) d[mode + 'r']++; else ST.wrong[tid] = (ST.wrong[tid] || 0) + 1;
  saveStats();
}
function unrecordWrong(mode, tid) { // „Doch richtig“
  const d = today(); d[mode + 'r']++;
  if (ST.wrong[tid] > 1) ST.wrong[tid]--; else delete ST.wrong[tid];
  saveStats();
}
function activity() {
  if (!(VIEW === 'learn' || VIEW === 'cards' || VIEW === 'sum') || document.hidden) { ACT.last = 0; return; }
  const now = Date.now();
  if (ACT.last && now > ACT.last && now - ACT.last <= IDLE) { today().t += now - ACT.last; saveStats(); }
  ACT.last = now;
}
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, activity, true));

const fmtTime = ms => { const m = Math.floor(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad2(m % 60) + ' min'; };
const fmtPct = (r, a) => a ? Math.round(100 * r / a) + ' %' : '–';
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
function sumDays(keys) { const s = EMPTY_DAY(); keys.forEach(k => { const d = ST.days[k]; if (d) Object.keys(s).forEach(x => { s[x] += d[x] || 0; }); }); return s; }
function streak() {
  const d = new Date(Date.now()); let n = 0;
  const has = x => { const v = ST.days[dayKey(x)]; return v && (v.la + v.ca) > 0; };
  if (!has(d)) d.setDate(d.getDate() - 1); // heute noch nicht gelernt: Serie bis gestern zählt
  while (has(d)) { n++; d.setDate(d.getDate() - 1); }

}
// Zahl in 700 ms hochzählen
function countUp(el, to, fmt) {

  const t0 = performance.now();

}
function renderStats() {

  $('stLegend').textContent = both.m + ' gemeistert, ' + both.l + ' am Lernen, ' + both.n + ' neu (von ' + both.total + ')' + (both.pr ? ', ' + both.pr + ' mit Prestige' : '');

  const now = new Date(Date.now()), keys = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); keys.push(dayKey(d)); }
  const allKeys = Object.keys(ST.days).sort();

    [streak(), 'Tage in Folge', n => Math.round(n) + ''],
    [td.la + td.ca, 'Antworten heute', n => Math.round(n) + ''],

    [wk.lr + wk.cr, 'Richtig, 7 Tage', n => fmtPct(n, wk.la + wk.ca)],

  Array.from($('stTiles').querySelectorAll('.tv')).forEach((el, i) => countUp(el, tiles[i][0], tiles[i][2]));

  const vals = keys.map(k => { const d = ST.days[k]; return d ? d.la + d.ca : 0; }), max = Math.max.apply(null, vals) || 1;
  const dateOf = i => { const d = new Date(now); d.setDate(d.getDate() - (13 - i)); return d; };
  $('stDays').innerHTML = keys.map((k, i) => {
    const d = dateOf(i);

      '<span class="col"><i style="height:' + (vals[i] ? Math.max(4, 100 * vals[i] / max) : 0) + '%"></i></span><span class="d">' + WD[d.getDay()].charAt(0) + '</span></button>';

  $('stDays').querySelectorAll('.col i').forEach(el => bars.push([el, 'scaleY(1)']));

  const mrow = (label, r, a) => '<div class="mrow"><span>' + label + '</span><span class="pv">' + fmtPct(r, a) + (a ? ' · ' + a + ' Antworten' : '') + '</span>' +
    '<span class="mt"><i style="background:var(--agua)" data-f="' + (a ? r / a : 0) + '"></i></span></div>';
  $('stAcc').innerHTML = mrow('Lernen', tot.lr, tot.la) + mrow('Karteikarten', tot.cr, tot.ca);

  $('stUnits').innerHTML = GROUPS.map(g => {
    if (!g.terms) g.terms = uniqueTerms(g.secs, true);
    const row = dir => { const c = counts(g.terms.map(t => item(t, dir))), T = c.total || 1; return '<div class="mrow"><span>' + (dir === 'es-de' ? 'ES → DE' : 'DE → ES') + (c.star > 0 ? ' <span class="star">★ ' + c.star + '</span>' : '') + '</span><span class="pv">' + c.m + ' von ' + c.total + '</span><span class="mt"><i class="f-pr" data-f="' + (c.m + c.p) / T + '"></i><i style="background:var(--ok)" data-f="' + c.m / T + '"></i></span></div>'; };
    return '<div class="urow"><span class="nm">' + esc(g.unit) + '</span>' + row('es-de') + row('de-es') + '</div>';
  }).join('');
  document.querySelectorAll('#stAcc .mt i, #stUnits .mt i').forEach(el => bars.push([el, 'scaleX(' + el.dataset.f + ')']));

  const byId = new Map(TERMS.map(t => [t.id, t]));
  const worst = Object.keys(ST.wrong).filter(id => byId.has(id)).sort((a, b) => ST.wrong[b] - ST.wrong[a]).slice(0, 10);
  $('stWrong').innerHTML = worst.map(id => { const t = byId.get(id); return '<li class="bad"><span class="n">' + ST.wrong[id] + '×</span><span class="a">' + esc(t.es) + '</span><span class="b">' + esc(t.de) + '</span></li>'; }).join('');
  $('stWrong').classList.toggle('hidden', !worst.length);
  $('stWrongNone').classList.toggle('hidden', !!worst.length);
  $('stSince').textContent = allKeys.length ? 'Gezählt seit ' + allKeys[0].split('-').reverse().join('.') : 'Statistik zählt ab jetzt mit.';
  grow(bars);
  enter($('statsBody'));
}
$('stReset').onclick = () => confirmDanger('Statistik wirklich löschen?',
  'Tage, Antworten, Lernzeit und die Fehlerliste werden gelöscht. Dein Lernfortschritt und das Prestige bleiben.',
  'Löschen', () => { ST = { days: {}, wrong: {} }; saveStats(); renderStats(); });

/* ---------- Auto-Update über GitHub Pages ---------- */
const UPDATE_URL = 'https://codajodavoda.github.io/vocabulario-app/', KU = 'vocabulario.update';
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
  document.body.appendChild(t); anim(t, [{ opacity: 0 }, { opacity: 1 }]);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3000);
}
(function () {
  const u = load(KU, null);
  if (!u) return;
  if (!(u.build >= BUILD)) { try { localStorage.removeItem(KU); } catch (e) {} return; } // eingebaute Version ist neuer
  if (u.build === BUILD && !u.shown) { u.shown = true; save(KU, u); setTimeout(() => toast('Update installiert'), 400); }
})();
function checkUpdate() {
  if (typeof fetch !== 'function') return;
  fetch(UPDATE_URL + 'version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if (!v || !(v.build > BUILD)) return;
      const cur = load(KU, null);
      if (cur && cur.build >= v.build) return;
      return fetch(UPDATE_URL + 'index.html?b=' + v.build, { cache: 'no-store' })
        .then(r => r.ok ? r.text() : null)
        .then(h => { if (h && h.indexOf('var BUILD = ' + v.build + ', NEXT_HTML') !== -1) save(KU, { build: v.build, html: h }); });
    })
    .catch(() => {});
}
setTimeout(checkUpdate, 1500);

/* Hintergrund-Animation anhalten, solange die App nicht sichtbar ist */
document.addEventListener('visibilitychange', () => { document.querySelector('.bg').classList.toggle('paused', document.hidden); });

syncSetup();
</script>
<script>
/* Lader: entweder die neuere Version anzeigen oder die App starten */
if (NEXT_HTML) setTimeout(function () { var h = NEXT_HTML; document.open(); document.write(h); document.close(); }, 0);
else { var appJs = document.createElement('script'); appJs.textContent = document.getElementById('appCode').textContent; document.body.appendChild(appJs); }
</script>
</body>
